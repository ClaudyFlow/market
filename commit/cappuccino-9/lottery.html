<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .slot-machine {
            width: 600px;
            margin: 40px auto;
            text-align: center;
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.8);
            padding: 40px 30px 32px;
            border: 3px solid #e9ecef;
            position: relative;
        }
        .slot-machine::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, #ffd700, #ffb300, #ff8c00);
            border-radius: 28px;
            z-index: -1;
        }
        .slot-row-wrapper {
            position: relative;
            width: 100%;
            height: 80px;
            margin-bottom: 20px;
        }
        .pointer {
            position: absolute;
            left: 50%;
            top: 6px;
            transform: translateX(-50%) translateY(-100%);
            font-size: 2em;
            color: #e74c3c;
            z-index: 2;
            pointer-events: none;
        }
        .slot-row {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
            border-radius: 15px;
            overflow: hidden;
            padding: 15px 0;
            width: auto;
            margin: 0 auto;
            position: relative;
            border: 2px solid #ffd700;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.2);
        }
        .slot-symbol {
            width: 160px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            color: #fff;
            opacity: 0.5;
            margin: 0 2px;
            border-radius: 8px;
            background: linear-gradient(135deg, #333 0%, #555 100%);
            transition: opacity 0.2s, color 0.2s, background 0.2s;
            font-family: 'Arial', sans-serif;
            box-sizing: border-box;
            padding: 5px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
            flex-shrink: 0;
        }
        .slot-symbol.active {
            opacity: 1;
            color: #2c3e50;
            background: linear-gradient(180deg, #ffd700 0%, #ffb300 50%, #ff8c00 100%);
            font-weight: bold;
            box-shadow: 0 0 20px 5px #ffd700, 0 0 15px #ffb300, 0 0 0 2px #fff inset, 0 0 0 4px #ffd70033;
            border: 3px solid #ffd700;
            transform: scale(1.1);
            z-index: 3;
            transition: 
                opacity 0.2s, 
                color 0.2s, 
                background 0.2s, 
                box-shadow 0.2s, 
                border 0.2s, 
                transform 0.18s cubic-bezier(.4,1.4,.6,1);
        }
        .slot-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .spin-btn {
            font-size: 1.6em;
            padding: 0.5em 2.2em;
            border-radius: 12px;
            background: linear-gradient(90deg, #ffd700 0%, #ffb300 100%);
            color: #a00;
            border: none;
            font-weight: bold;
            box-shadow: 0 2px 12px #ffd70055;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .spin-btn:disabled {
            background: #eee;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        .result {
            font-size: 1.3em;
            margin-top: 0;
            margin-bottom: 0;
            color: #b80000;
            font-weight: bold;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <h1>抽奖系统</h1>
    <div class="slot-machine">
        <div class="slot-header">
            <button class="spin-btn" id="spinBtn">开始抽奖</button>
            <div id="result" class="result" style="display: none;">
                <span id="resultText"></span>
            </div>
        </div>
        <div class="slot-row-wrapper">
            <div class="pointer">▼</div>
            <div class="slot-row" id="slotRow"></div>
        </div>
    </div>

    <script>
        const symbols = ['iPhone 15', 'MacBook Pro', 'AirPods Pro', 'iPad Air', 'Apple Watch', '谢谢参与', '谢谢参与', '谢谢参与'];
        const visibleCount = 9;
        const pointerIndex = 4;
        let row = [];
        let spinning = false;
        let result = null;
        let intervalId = null;
        let finalIndex = 0;

        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const slotRow = document.getElementById('slotRow');

        function resetRow() {
            row = Array(visibleCount + 20).fill().map(() => symbols[Math.floor(Math.random() * symbols.length)]);
            renderRow();
        }

        function renderRow() {
            slotRow.innerHTML = '';
            row.forEach((symbol, idx) => {
                const div = document.createElement('div');
                div.className = 'slot-symbol' + (idx === 14 ? ' active' : '');
                div.textContent = symbol;
                slotRow.appendChild(div);
            });
        }

        function spin() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            resultDiv.style.display = 'none';
            result = null;
            resetRow();
            let total = row.length;
            let currentOffset = 0;
            finalIndex = Math.floor(Math.random() * (total - visibleCount)) + pointerIndex;
            let speed = 60;
            let step = 0;
            clearInterval(intervalId);
            intervalId = setInterval(() => {
                if (step < 30) {
                    speed = 60;
                } else if (step < 50) {
                    speed = 100;
                } else {
                    speed = 180;
                }
                if (currentOffset < finalIndex - pointerIndex) {
                    currentOffset++;
                    row.push(symbols[Math.floor(Math.random() * symbols.length)]);
                    row.shift();
                    renderRow();
                    step++;
                } else {
                    clearInterval(intervalId);
                    spinning = false;
                    spinBtn.disabled = false;
                    checkResult();
                }
            }, speed);
        }

        function checkResult() {
            result = row[14] !== '谢谢参与';
            resultText.textContent = result ? `恭喜中奖！获得 ${row[14]}！` : '很遗憾，未中奖';
            resultDiv.style.display = 'block';
        }

        spinBtn.addEventListener('click', spin);
        resetRow();
    </script>
</body>
</html>
