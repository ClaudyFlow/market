<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 购物商城系统</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    :root {
      --mall-primary: #00d4ff;
      --mall-secondary: #00ff88;
      --mall-warning: #ffd700;
      --mall-text-primary: #ffffff;
      --mall-text-secondary: #88aacc;
      --mall-bg-card: rgba(26, 31, 58, 0.6);
      --mall-border: rgba(0, 212, 255, 0.15);
    }
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      background-color: #0a0e1a;
    }
    .app-container {
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(0, 212, 255, 0.15) 0%, rgba(10, 14, 26, 0.8) 100%);
      padding: 40px 20px;
      color: var(--mall-text-primary);
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .page-title {
      color: var(--mall-text-primary);
      font-size: 32px;
      margin-bottom: 40px;
      text-align: center;
      background: linear-gradient(90deg, var(--mall-primary), var(--mall-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }
    .user-menu {
      background: var(--mall-bg-card);
      border: 1px solid var(--mall-border);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      background: rgba(26, 31, 58, 0.6);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 12px;
      transition: all 0.3s;
      height: 80px;
      cursor: pointer;
      text-decoration: none;
    }
    .menu-item:hover {
      transform: translateX(8px);
      border-color: var(--mall-primary);
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.05));
    }
    .menu-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mall-primary), var(--mall-secondary));
      color: #fff;
      font-size: 24px;
      margin-right: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
    }
    .menu-text {
      font-size: 16px;
      color: var(--mall-text-secondary);
      font-weight: 500;
      flex: 1;
    }
    /* VIP 卡片 */
    .menu-item.vip-card {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.1));
      border: 2px solid rgba(255, 215, 0, 0.4);
      height: 100px;
      padding: 16px 24px;
    }
    .menu-item.vip-card:hover {
      border-color: #ffd700;
      box-shadow: 0 4px 30px rgba(255, 215, 0, 0.5);
    }
    .menu-item.vip-card .menu-icon {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.5);
    }
    .vip-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      margin-left: 16px;
    }
    .vip-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vip-title .menu-text {
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
    }
    .vip-info { display: flex; gap: 24px; }
    .vip-info .info-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .vip-info .info-label { font-size: 12px; color: #88aacc; }
    .vip-info .info-value { font-size: 16px; font-weight: bold; color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-container">
      <div class="container">
        <h1 class="page-title">个人中心</h1>
        <div class="user-menu">
          <div class="menu-grid">
            <div class="menu-item" @click="navigateTo('user-order.html')">
              <div class="menu-icon"><el-icon><Document /></el-icon></div>
              <span class="menu-text">我的订单</span>
            </div>
            <div class="menu-item" @click="navigateTo('user-favorite.html')">
              <div class="menu-icon"><el-icon><Star /></el-icon></div>
              <span class="menu-text">我的收藏</span>
            </div>
            <div class="menu-item" @click="navigateTo('user-follow.html')">
              <div class="menu-icon"><el-icon><User /></el-icon></div>
              <span class="menu-text">我的关注</span>
            </div>
            <div class="menu-item" @click="navigateTo('user-address.html')">
              <div class="menu-icon"><el-icon><Location /></el-icon></div>
              <span class="menu-text">地址管理</span>
            </div>
            <div class="menu-item" @click="navigateTo('user-credit.html')">
              <div class="menu-icon"><el-icon><Trophy /></el-icon></div>
              <span class="menu-text">我的积分</span>
            </div>
            <div class="menu-item" @click="navigateTo('user-coupon.html')">
              <div class="menu-icon"><el-icon><Ticket /></el-icon></div>
              <span class="menu-text">优惠券</span>
            </div>
            <div class="menu-item vip-card" @click="navigateTo('user-vip.html')">
              <div class="menu-icon"><el-icon><Star /></el-icon></div>
              <div class="vip-content">
                <div class="vip-title">
                  <span class="menu-text">VIP 会员中心</span>
                  <el-tag type="warning" size="small">HOT</el-tag>
                </div>
                <div class="vip-info">
                  <div class="info-item">
                    <span class="info-label">当前等级</span>
                    <span class="info-value">普通会员</span>
                  </div>
                  <div class="info-item">
                    <span class="info-label">我的积分</span>
                    <span class="info-value">0</span>
                  </div>
                  <div class="info-item">
                    <span class="info-label">成长值</span>
                    <span class="info-value">0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script>
    const { createApp } = Vue;
    const app = createApp({
      setup() {
        const navigateTo = (page) => {
          window.location.href = page;
        };
        return { navigateTo };
      }
    });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
