<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地址管理 - 购物商城系统</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    :root {
      --mall-primary: #00d4ff;
      --mall-secondary: #00ff88;
      --mall-text-primary: #ffffff;
      --mall-text-secondary: #88aacc;
      --mall-bg-card: rgba(26, 31, 58, 0.6);
      --mall-border: rgba(0, 212, 255, 0.15);
    }
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
      background-color: #0a0e1a;
    }
    .app-container {
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(0, 212, 255, 0.15) 0%, rgba(10, 14, 26, 0.8) 100%);
      padding: 40px 20px;
      color: var(--mall-text-primary);
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .sub-title {
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(90deg, var(--mall-primary), var(--mall-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      margin-right: 20px;
      background: transparent;
      border: 1px solid var(--mall-primary);
      color: var(--mall-primary);
      cursor: pointer;
    }
    .back-btn:hover { background: rgba(0, 212, 255, 0.1); }
    .add-btn {
      background: linear-gradient(90deg, var(--mall-primary), var(--mall-secondary));
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
    .address-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    .address-card {
      background: rgba(26, 31, 58, 0.6);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .address-card:hover {
      border-color: var(--mall-primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    .address-card.is-default {
      border-color: #ffd700;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(26, 31, 58, 0.6));
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .user-info { display: flex; flex-direction: column; gap: 4px; }
    .name { font-size: 18px; font-weight: bold; color: #fff; }
    .phone { font-size: 14px; color: #88aacc; }
    .default-tag { background: #ffd700; color: #000; border: none; font-weight: bold; }
    .card-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
    }
    .location-icon { margin-top: 2px; color: var(--mall-primary); flex-shrink: 0; }
    .card-actions {
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      margin-top: auto;
    }
    .el-dialog {
      background: rgba(20, 24, 40, 0.95) !important;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .el-dialog__title { color: #fff; }
    .el-form-item__label { color: #ccc; }
    .el-input__wrapper {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: none !important;
    }
    .el-input__inner { color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-container">
      <div class="container">
        <div class="page-header">
          <div style="display: flex; align-items: center;">
            <el-button class="back-btn" @click="goBack" circle>
              <el-icon><Arrow-Left /></el-icon>
            </el-button>
            <h2 class="sub-title">地址管理</h2>
          </div>
          <el-button type="primary" class="add-btn" @click="openDialog('add')">
            <el-icon><Plus /></el-icon> 新增收货地址
          </el-button>
        </div>
        <div class="address-list">
          <div v-for="item in addressList" :key="item.id" class="address-card" :class="{ 'is-default': item.isDefault }">
            <div class="card-header">
              <div class="user-info">
                <span class="name">{{ item.name }}</span>
                <span class="phone">{{ item.phone }}</span>
              </div>
              <el-tag v-if="item.isDefault" type="warning" effect="dark" class="default-tag">默认地址</el-tag>
            </div>
            <div class="card-body">
              <el-icon class="location-icon"><Location /></el-icon>
              <span>{{ item.region }} {{ item.detail }}</span>
            </div>
            <div class="card-actions">
              <el-button link type="primary" @click="openDialog('edit', item)">编辑</el-button>
              <el-button link type="primary" @click="setDefault(item)" v-if="!item.isDefault">设为默认</el-button>
              <el-button link type="danger" @click="deleteAddress(item.id)">删除</el-button>
            </div>
          </div>
          <el-empty v-if="addressList.length === 0" description="暂无收货地址" />
        </div>
      </div>
    </div>
    <!-- 弹窗 -->
    <el-dialog v-model="dialogVisible" :title="dialogTitle" width="500px">
      <el-form :model="form" label-width="80px">
        <el-form-item label="收货人">
          <el-input v-model="form.name" placeholder="请输入收货人姓名" />
        </el-form-item>
        <el-form-item label="手机号">
          <el-input v-model="form.phone" placeholder="请输入手机号码" maxlength="11" />
        </el-form-item>
        <el-form-item label="所在地区">
          <el-input v-model="form.region" placeholder="省/市/区" />
        </el-form-item>
        <el-form-item label="详细地址">
          <el-input v-model="form.detail" type="textarea" :rows="3" placeholder="街道门牌" />
        </el-form-item>
        <el-form-item label="设为默认">
          <el-switch v-model="form.isDefault" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveAddress">确认保存</el-button>
      </template>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      setup() {
        const addressList = ref([]);
        const dialogVisible = ref(false);
        const dialogTitle = ref('新增地址');
        const form = reactive({
          id: null, name: '', phone: '', region: '', detail: '', isDefault: false
        });

        const goBack = () => {
          window.location.href = 'user-center.html';
        };

        const loadAddress = () => {
          const saved = localStorage.getItem('demo_address');
          if (saved) {
            try { addressList.value = JSON.parse(saved); } catch (e) { addressList.value = []; }
          }
        };

        const saveAddressLocal = () => {
          localStorage.setItem('demo_address', JSON.stringify(addressList.value));
        };

        const openDialog = (type, item = null) => {
          if (type === 'edit' && item) {
            dialogTitle.value = '编辑地址';
            Object.assign(form, JSON.parse(JSON.stringify(item)));
          } else {
            dialogTitle.value = '新增收货地址';
            form.id = null; form.name = ''; form.phone = ''; 
            form.region = ''; form.detail = ''; form.isDefault = false;
          }
          dialogVisible.value = true;
        };

        const saveAddress = () => {
          if (!form.name || !form.phone || !form.region || !form.detail) {
            ElMessage.warning('请填写完整信息'); return;
          }
          if (form.id) {
            const idx = addressList.value.findIndex(i => i.id === form.id);
            if (idx !== -1) {
              if (form.isDefault) addressList.value.forEach(i => i.isDefault = false);
              addressList.value[idx] = { ...form };
              ElMessage.success('修改成功');
            }
          } else {
            if (form.isDefault) addressList.value.forEach(i => i.isDefault = false);
            addressList.value.push({ ...form, id: Date.now() });
            ElMessage.success('添加成功');
          }
          saveAddressLocal();
          dialogVisible.value = false;
        };

        const deleteAddress = (id) => {
          ElMessageBox.confirm('确定要删除吗？', '提示', { type: 'warning' }).then(() => {
            addressList.value = addressList.value.filter(i => i.id !== id);
            saveAddressLocal();
            ElMessage.success('删除成功');
          });
        };

        const setDefault = (item) => {
          addressList.value.forEach(i => i.isDefault = false);
          item.isDefault = true;
          saveAddressLocal();
          ElMessage.success('已设为默认地址');
        };

        onMounted(() => { loadAddress(); });

        return {
          goBack, addressList, dialogVisible, dialogTitle, form,
          openDialog, saveAddress, deleteAddress, setDefault
        };
      }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
