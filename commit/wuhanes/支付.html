<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商场购物系统 - 结算支付</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 20px;
            color: #333;
        }

        /* 容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* 头部 */
        .header {
            background-color: #ff4d4f;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        /* 内容区域 */
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 25px;
            gap: 25px;
        }

        /* 左侧：支付表单 */
        .pay-form {
            flex: 1;
            min-width: 300px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #222;
            border-left: 4px solid #ff4d4f;
            padding-left: 10px;
        }

        /* 支付方式 */
        .pay-method {
            margin-bottom: 25px;
        }

        .method-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .method-item:hover {
            border-color: #ff4d4f;
            background-color: #fff9f9;
        }

        .method-item.active {
            border-color: #ff4d4f;
            background-color: #fff0f0;
        }

        .method-item input {
            margin-right: 12px;
        }

        .method-item i {
            font-size: 20px;
            margin-right: 10px;
            color: #555;
        }

        /* 收货信息 */
        .address-form {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff4d4f;
        }

        /* 右侧：订单清单 */
        .order-info {
            flex: 1;
            min-width: 300px;
            background: #fafbfc;
            padding: 20px;
            border-radius: 10px;
        }

        .goods-list {
            margin-bottom: 20px;
        }

        .goods-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }

        .goods-name {
            font-weight: 500;
        }

        .price {
            color: #ff4d4f;
            font-weight: bold;
        }

        /* 价格总计 */
        .total-price {
            padding: 15px 0;
            border-top: 1px solid #eee;
            font-size: 16px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .final-total {
            font-size: 20px;
            color: #ff4d4f;
            font-weight: bold;
            margin-top: 10px;
        }

        /* 支付按钮 */
        .pay-btn {
            width: 100%;
            padding: 15px;
            background-color: #ff4d4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .pay-btn:hover {
            background-color: #f03e3f;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <i class="fas fa-shopping-cart"></i> 商场购物系统 - 结算支付
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 左侧：支付表单 -->
            <div class="pay-form">
                <!-- 收货信息 -->
                <div class="address-form">
                    <h3 class="section-title">收货信息</h3>
                    <div class="form-group">
                        <label>收货人姓名</label>
                        <input type="text" id="name" placeholder="请输入收货人姓名" required>
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="tel" id="phone" placeholder="请输入手机号码" required>
                    </div>
                    <div class="form-group">
                        <label>收货地址</label>
                        <input type="text" id="address" placeholder="请输入详细收货地址" required>
                    </div>
                </div>

                <!-- 支付方式 -->
                <div class="pay-method">
                    <h3 class="section-title">选择支付方式</h3>
                    <label class="method-item active">
                        <input type="radio" name="payType" value="wechat" checked>
                        <i class="fab fa-weixin" style="color:#07c160"></i>
                        微信支付
                    </label>
                    <label class="method-item">
                        <input type="radio" name="payType" value="alipay">
                        <i class="fab fa-alipay" style="color:#1677ff"></i>
                        支付宝支付
                    </label>
                    <label class="method-item">
                        <input type="radio" name="payType" value="card">
                        <i class="fas fa-credit-card"></i>
                        银行卡支付
                    </label>
                    <label class="method-item">
                        <input type="radio" name="payType" value="cash">
                        <i class="fas fa-money-bill-wave"></i>
                        货到付款
                    </label>
                </div>
            </div>

            <!-- 右侧：订单清单 -->
            <div class="order-info">
                <h3 class="section-title">订单清单</h3>
                <div class="goods-list">
                    <div class="goods-item">
                        <span class="goods-name">男士休闲外套</span>
                        <span class="price">¥ 299.00</span>
                    </div>
                    <div class="goods-item">
                        <span class="goods-name">纯棉短袖T恤</span>
                        <span class="price">¥ 89.00</span>
                    </div>
                    <div class="goods-item">
                        <span class="goods-name">运动休闲鞋</span>
                        <span class="price">¥ 199.00</span>
                    </div>
                </div>

                <div class="total-price">
                    <div class="total-row">
                        <span>商品总价</span>
                        <span>¥ 587.00</span>
                    </div>
                    <div class="total-row">
                        <span>运费</span>
                        <span>¥ 0.00</span>
                    </div>
                    <div class="total-row">
                        <span>优惠折扣</span>
                        <span>- ¥ 38.00</span>
                    </div>
                    <div class="total-row final-total">
                        <span>实付金额</span>
                        <span>¥ 549.00</span>
                    </div>
                </div>

                <!-- 支付按钮 -->
                <button class="pay-btn" onclick="submitPay()">
                    <i class="fas fa-check-circle"></i> 确认支付
                </button>
            </div>
        </div>
    </div>

    <script>
        // 支付方式切换高亮
        const methodItems = document.querySelectorAll('.method-item');
        methodItems.forEach(item => {
            item.addEventListener('click', () => {
                methodItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // 提交支付验证
        function submitPay() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!name) {
                alert('请输入收货人姓名！');
                return;
            }
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号码！');
                return;
            }
            if (!address) {
                alert('请输入详细收货地址！');
                return;
            }

            // 支付成功提示
            alert('✅ 订单提交成功！\n实付金额：¥549.00\n感谢您的购买！');
            // 可在这里添加跳转页面逻辑
        }
    </script>
</body>
</html>
