# Server Configuration
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:market.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=market-platform-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation
jwt.expiration=86400000

# Security Configuration
spring.security.filter.dispatcher-type=async,servlet

# Mail Configuration (邮箱配置)
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=2481036245@qq.com
spring.mail.password=mpncdclwknlodjab
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.default-encoding=UTF-8
spring.mail.from=Market <noreply@market.com>

# Verification Code Configuration
verification.code.expire.minutes=5
verification.code.length=6

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Allow circular references (temporary fix)
spring.main.allow-circular-references=true