# Server Configuration
server.port=8080

# Activate PostgreSQL Profile
spring.profiles.active=postgresql

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/market
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
# 注意：生产环境请使用环境变量配置
# export JWT_SECRET="your-secure-secret-key-here"
# export JWT_EXPIRATION=86400000
jwt.secret=${JWT_SECRET:market-platform-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security Configuration
spring.security.filter.dispatcher-type=async,servlet

# Mail Configuration (邮箱配置)
# 注意：生产环境请使用环境变量配置敏感信息
# export MAIL_USERNAME="your-email@qq.com"
# export MAIL_PASSWORD="your-app-password"
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:2481036245@qq.com}
spring.mail.password=${MAIL_PASSWORD:mpncdclwknlodjab}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.default-encoding=UTF-8
spring.mail.from=Market <noreply@market.com>

# Verification Code Configuration
verification.code.expire.minutes=5
verification.code.length=6

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Allow circular references (temporary fix)
spring.main.allow-circular-references=true

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MarketHikariPool

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=cache:
spring.cache.redis.use-key-prefix=true