# Server Configuration
server.port=8080

# 开发环境默认使用 dev profile（PostgreSQL，凭据 market/market）
spring.profiles.active=dev

# Redis 配置（如果不需要 Redis，可以禁用）
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000

# ==================== RabbitMQ 配置 ====================
# 是否启用 RabbitMQ (默认禁用，需要时设置为 true)
spring.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

# 生产者确认
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# 消费者配置
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# ==================== 消息队列业务配置 ====================
# 队列名称配置 (可自定义)
market.mq.exchange=market.exchange
market.mq.order-delay-exchange=market.order.delay.exchange
market.mq.email-queue=market.email.queue
market.mq.notification-queue=market.notification.queue
market.mq.order-cancel-queue=market.order.cancel.queue
market.mq.order-delay-queue=market.order.delay.queue
market.mq.credit-queue=market.credit.queue
market.mq.audit-log-queue=market.audit.log.queue

# 业务开关
market.mq.async-email=true
market.mq.async-notification=true
market.mq.order-timeout-enabled=true
market.mq.order-timeout-ms=1800000

# ==================== 运营功能配置 ====================
# 评价自动审核
market.review.auto-audit-enabled=true
market.review.auto-approve-low-risk=true

# 论坛自动审核
market.forum.auto-audit-enabled=true