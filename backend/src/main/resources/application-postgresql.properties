# ============================================================
# PostgreSQL 数据库配置
# ============================================================
# 使用方法：
# 1. 复制此文件为 application-postgresql.properties
# 2. 修改下面的数据库连接信息
# 3. 在 application.properties 中激活 profile: spring.profiles.active=postgresql
# ============================================================

# PostgreSQL 数据库连接配置
spring.datasource.url=jdbc:postgresql://localhost:5432/market
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 配置
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# 连接池配置 (HikariCP)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# 激活此配置的方式：
# 方式 1: 在 application.properties 中添加 spring.profiles.active=postgresql
# 方式 2: 启动时添加参数 --spring.profiles.active=postgresql
# 方式 3: 设置环境变量 SPRING_PROFILES_ACTIVE=postgresql
